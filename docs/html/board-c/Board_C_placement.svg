<rect x="72.0" y="412.0" width="330.0" height="7.0" rx="1" fill="#f2f4f7" stroke="#98a2b3" stroke-width="1" stroke-dasharray="3 2"/><text x="64.0" y="417.2" text-anchor="end" class="rail-lab" fill="#98a2b3">unused</text>
<rect x="72.0" y="421.0" width="330.0" height="7.0" rx="1" fill="#f2f4f7" stroke="#98a2b3" stroke-width="1" stroke-dasharray="3 2"/><text x="64.0" y="426.2" text-anchor="end" class="rail-lab" fill="#98a2b3">unused</text>
