; Production operator image for the LilyGo T-Display-S3.
; USB:    pio run -e tdisplay_s3_prod -t upload --upload-port /dev/ttyACM0
; Wi-Fi:  pio run -e tdisplay_s3_prod_ota -t upload

[env:tdisplay_s3_prod]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
board_upload.before_reset = usb_reset
build_src_filter =
    -<*>
    +<prod/>
    +<bottle_key.cpp>
    +<adc_util.cpp>
    +<as5600.cpp>
build_flags =
    -DTDISPLAY_S3_PROD
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
lib_deps =
    moononournation/GFX Library for Arduino @ 1.4.9

[env:tdisplay_s3_prod_ota]
extends = env:tdisplay_s3_prod
upload_protocol = espota
upload_port = private-reserve.local
upload_flags =
    --auth=reserve-ota
    --timeout=60
